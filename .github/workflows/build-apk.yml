name: Build Medsathi APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Install npm dependencies
        run: npm install

      # Bakes the keys into www/config.js (git-ignored) so the downloaded APK
      # works with no setup. Set them once in Settings -> Secrets and variables
      # -> Actions. Missing secrets simply build an app without built-in keys.
      - name: Inject API keys into app build
        env:
          TF_KEY: ${{ secrets.TINYFISH_API_KEY }}
          OF_KEY: ${{ secrets.OPENFDA_API_KEY }}
          GM_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const keys = {
            tinyfish: process.env.TF_KEY || "",
            openfda: process.env.OF_KEY || "",
            gemini: process.env.GM_KEY || ""
          };
          if (Object.values(keys).some(Boolean)) {
            fs.writeFileSync("www/config.js", "window.CURAMED_CONFIG = " + JSON.stringify({apiKeys: keys}, null, 2) + ";\n");
            console.log("Injected built-in keys:", Object.keys(keys).filter(k => keys[k]).join(", "));
          } else {
            console.log("No API key secrets set - building without built-in keys.");
          }
          '

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android alarm permission
        run: python3 scripts/patch_android.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Medsathi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
